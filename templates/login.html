{% extends "base.html" %}

{% block title %}Login - Birthday Memories Vault{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel">
        
        <!-- Glowing Header with Icon -->
        <div class="auth-header">
            <div class="auth-badge-icon">🎁</div>
            <span class="badge-pill">Private Birthday Vault</span>
            <h1 class="gradient-text title-serif auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Enter your private login credentials to access the celebration.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="login-email">
                    <span class="label-icon">✉️</span> Email Address (Login ID)
                </label>
                <input type="email" id="login-email" name="email" placeholder="name@example.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="login-password">
                    <span class="label-icon">🔑</span> Password
                </label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" name="password" placeholder="Enter your password..." required autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" title="Toggle password visibility">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="btn auth-submit-btn">
                <span>Unlock Birthday Vault</span>
                <span class="btn-arrow">✨</span>
            </button>
        </form>

        <div class="auth-footer-note" style="margin-top: 1.5rem;">
            <span>🔒 Protected Private Vault • Credentials created by Admin</span>
        </div>

    </div>
</div>
{% endblock %}
